<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <div class="nav-left">
                <img src="{{Logo}}" alt="logo " class="nav-logo">
                
            </div>
            
        </div>
    </nav>

    <main>
        <div class="container">
            <h2>Hi {{name}} ,</h2>
            
            <p class="main-text">You recently requested to reset your password for your waslah account. Use this otp below to reset it.</p>
            
            <div class="otp-display-container">
                <span class="otp-digit">{{otp}}</span>  
                
            </div>

            <p class="expiry-text">This code expires in 15 minutes.</p>

            <p class="thanks-text">
                Thanks,<br>
                Waslah support team 
            </p>

            <hr class="divider">

            <p class="trouble-text">
                If you're having trouble with the code above, copy and paste it manually.
            </p>
        </div>
    </main>
</body>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    line-height: 1.6;
    background-color: #2d2d2d;
    color: #ffffff;
    min-height: 100vh;
}

.navbar {
    background-color: #2d2d2d;
    padding: 1rem 2rem;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    
}

.nav-content {
    max-width: 1200px;
    margin: 0 auto;
    
   

}

.nav-left {
    
    align-items: center;
    gap: 1rem;
    margin-left: 27%;
    
    

    
}

.nav-logo {
    height: 75px;
    width: 75px;
    border-radius: 50px 50px 50px 50px ;
    
}

.nav-brand {
    color: #ffffff;
    font-size: 1.5rem;
    font-weight: bold;
}



.logo-name {
    color: #00A3AD;
    font-size: 30px;
    font-weight: 500;
}

.container {
    max-width: 600px;
    margin: 0rem auto ;
    padding: 2rem;
    text-align: left;
}


h2 {
    font-size: 24px;
    margin-bottom: 1.5rem;
    color: #ffffff;
}

.main-text {
    font-size: 16px;
    margin-bottom: 2rem;
    color: #ffffff;
}

.otp-display-container {
    display: flex;
    gap: 0.8rem;
    justify-content: flex-start;
    margin: 2rem 0;
}

.otp-digit {
    width: 360px;
    height: 60px;
    background: #3d3d3d;
    border: 2px solid #00A3AD;
    border-radius: 8px;
    color: #00A3AD;
    font-size: 2rem;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
    text-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
}

.expiry-text {
    color: #ffffff;
    font-size: 14px;
    margin: 1.5rem 0;
}

.thanks-text {
    margin: 2rem 0;
    line-height: 1.6;
    color: #ffffff;
}

.divider {
    border: none;
    border-top: 1px solid #3d3d3d;
    margin: 2rem 0;
}

.trouble-text {
    color: #ffffff;
    opacity: 0.8;
    font-size: 14px;
    margin-bottom: 1rem;
}

</style>
</html>
